<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WeatherNow — real-time weather for any city worldwide."
    />
    <title>WeatherNow — Real-Time Weather Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        scroll-behavior: auto;
      }
      /* Reset */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* Base */
      body {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #fff;
        padding: 1.5rem 1rem;
        overflow-x: hidden;
        position: relative;
        background: #0b1f3a;
      }

      /* Cloud photo background */
      .sky-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image: url('clouds_bg.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        animation: cloudPan 45s linear infinite alternate;
        transform-origin: center;
      }

      @keyframes cloudPan {
        0%   { background-position: 0% 40%;   transform: scale(1.02); }
        50%  { background-position: 50% 50%;  transform: scale(1.06); }
        100% { background-position: 100% 45%; transform: scale(1.02); }
      }

      /* Dark gradient overlay */
      .sky-overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          160deg,
          rgba(5, 15, 40, 0.65) 0%,
          rgba(10, 25, 60, 0.50) 50%,
          rgba(5, 10, 30, 0.75) 100%
        );
        backdrop-filter: blur(2px);
      }

      /* App Wrapper */
      .app {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
        animation: appEntrance 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes appEntrance {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Header */
      .header { display: flex; align-items: center; justify-content: space-between; padding: 0 0.2rem; }
      .logo   { display: flex; align-items: center; gap: 0.65rem; }

      .logo-svg {
        width: 34px; height: 34px;
        filter: drop-shadow(0 2px 8px rgba(251,191,36,0.6));
        animation: logoFloat 4s ease-in-out infinite;
      }

      @keyframes logoFloat {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-3px); }
      }

      .logo-text {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      }

      .badge-aws {
        font-size: 0.68rem;
        font-weight: 700;
        background: rgba(255, 153, 0, 0.2);
        color: #ff9900;
        border: 1px solid rgba(255, 153, 0, 0.4);
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
      }

      /* Search Bar */
      .search-bar {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        background: rgba(8, 16, 38, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 16px;
        padding: 0.55rem 0.65rem 0.55rem 1rem;
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        transition: border-color 0.25s, box-shadow 0.25s;
      }

      .search-bar:focus-within {
        border-color: rgba(250, 204, 21, 0.7);
        box-shadow: 0 4px 28px rgba(250, 204, 21, 0.25), inset 0 1px 0 rgba(255,255,255,0.2);
      }

      .search-icon {
        width: 19px;
        height: 19px;
        color: rgba(255, 255, 255, 0.55);
        flex-shrink: 0;
      }

      #city-input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        font-family: inherit;
        font-size: 0.95rem;
        color: #fff;
        min-width: 0;
      }

      #city-input::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }

      #search-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: #000;
        font-weight: 700;
        font-size: 0.85rem;
        border: none;
        padding: 0.45rem 0.85rem;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }

      #search-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
      }

      #search-btn:active {
        transform: translateY(0);
      }

      /* Weather Card */
      .card {
        background: rgba(14, 22, 45, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 24px;
        padding: 1.5rem;
        backdrop-filter: blur(28px) saturate(190%);
        -webkit-backdrop-filter: blur(28px) saturate(190%);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .city-name {
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.2;
        color: #fff;
      }

      .date-time {
        font-size: 0.82rem;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 0.2rem;
        font-weight: 500;
      }

      .weather-icon {
        font-size: 2.5rem;
        line-height: 1;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
      }

      .card-mid {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
      }

      .temperature {
        font-size: 3.5rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        background: linear-gradient(180deg, #ffffff 30%, #e2e8f0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .condition {
        font-size: 1.05rem;
        font-weight: 600;
        color: #fde047;
        text-shadow: 0 1px 6px rgba(0,0,0,0.4);
      }

      .sep {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        margin: 0.1rem 0;
      }

      /* Stats Grid */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
      }

      .stat {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 0.75rem 0.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.35rem;
        transition: transform 0.2s, background 0.2s;
      }

      .stat:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-2px);
      }

      .stat-icon {
        width: 32px;
        height: 32px;
      }

      .stat-icon svg {
        width: 100%;
        height: 100%;
      }

      .stat-label {
        font-size: 0.72rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.6);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .stat-value {
        font-size: 1rem;
        font-weight: 700;
        color: #fff;
      }

      .quick-cities {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        overflow-x: auto;
        padding-bottom: 0.2rem;
        scrollbar-width: none;
      }

      .quick-cities::-webkit-scrollbar {
        display: none;
      }

      .city-pill {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.72rem;
        font-weight: 600;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
      }

      .city-pill:hover {
        background: rgba(250, 204, 21, 0.2);
        border-color: rgba(250, 204, 21, 0.4);
        color: #fde047;
      }
    </style>
  </head>
  <body>
    <!-- Cloud photo background with slow pan -->
    <div class="sky-bg" aria-hidden="true"></div>
    <!-- Dark overlay so card reads well -->
    <div class="sky-overlay" aria-hidden="true"></div>

    <main class="app">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <svg class="logo-svg" viewBox="0 0 36 36" fill="none">
            <defs>
              <radialGradient id="lg" cx="30%" cy="30%">
                <stop offset="0%" stop-color="#fbbf24" />
                <stop offset="100%" stop-color="#f59e0b" />
              </radialGradient>
            </defs>
            <circle cx="14" cy="14" r="7" fill="url(#lg)" />
            <ellipse cx="22" cy="23" rx="10" ry="6" fill="rgba(255,255,255,0.92)" />
            <ellipse cx="16" cy="25" rx="8" ry="5.5" fill="rgba(255,255,255,0.92)" />
            <ellipse cx="28" cy="24" rx="6" ry="4.5" fill="rgba(255,255,255,0.92)" />
          </svg>
          <span class="logo-text">WeatherNow</span>
        </div>
        <span class="badge-aws">☁️ AWS Amplify</span>
      </header>

      <!-- Search -->
      <div class="search-bar">
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="7" />
          <line x1="16.5" y1="16.5" x2="22" y2="22" />
        </svg>
        <input
          type="text"
          id="city-input"
          placeholder="Search for a city (e.g. London, Lahore, Tokyo)..."
          aria-label="City name"
          autocomplete="off"
        />
        <button id="search-btn" aria-label="Search">
          <span class="btn-text">Search</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>

      <!-- Quick sample city shortcuts -->
      <div class="quick-cities">
        <button type="button" class="city-pill" data-city="London">London</button>
        <button type="button" class="city-pill" data-city="Lahore">Lahore</button>
        <button type="button" class="city-pill" data-city="New York">New York</button>
        <button type="button" class="city-pill" data-city="Tokyo">Tokyo</button>
        <button type="button" class="city-pill" data-city="Dubai">Dubai</button>
      </div>

      <!-- Weather Card -->
      <div class="card">
        <div class="card-top">
          <div class="location">
            <h1 id="city-name" class="city-name">London, GB</h1>
            <p id="date-time" class="date-time"></p>
          </div>
          <span id="weather-icon" class="weather-icon">🌤</span>
        </div>

        <div class="card-mid">
          <p class="temperature" id="temperature">18.5°C</p>
          <p class="condition" id="condition">Partly Cloudy</p>
        </div>

        <div class="sep"></div>

        <div class="stats">
          <div class="stat s1">
            <div class="stat-icon">
              <svg viewBox="0 0 40 40" fill="none">
                <defs>
                  <linearGradient id="hG" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#60a5fa" />
                    <stop offset="100%" stop-color="#3b82f6" />
                  </linearGradient>
                </defs>
                <circle cx="20" cy="20" r="20" fill="url(#hG)" opacity=".2" />
                <path
                  d="M20 10 C20 10 12 19 12 24a8 8 0 0016 0C28 19 20 10 20 10z"
                  fill="url(#hG)"
                  opacity=".9"
                />
                <ellipse
                  cx="16"
                  cy="23"
                  rx="2"
                  ry="3"
                  fill="#fff"
                  opacity=".35"
                  transform="rotate(-20 16 23)"
                />
              </svg>
            </div>
            <span class="stat-label">Humidity</span>
            <span class="stat-value" id="humidity">65%</span>
          </div>

          <div class="stat s2">
            <div class="stat-icon">
              <svg viewBox="0 0 40 40" fill="none">
                <defs>
                  <linearGradient id="wG" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#34d399" />
                    <stop offset="100%" stop-color="#10b981" />
                  </linearGradient>
                </defs>
                <circle cx="20" cy="20" r="20" fill="url(#wG)" opacity=".2" />
                <path
                  d="M10 16h13a4 4 0 000-8"
                  stroke="url(#wG)"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <path
                  d="M10 20h17a4 4 0 010 8H24"
                  stroke="url(#wG)"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <path
                  d="M10 24h8"
                  stroke="url(#wG)"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <span class="stat-label">Wind</span>
            <span class="stat-value" id="wind">14 km/h</span>
          </div>

          <div class="stat s3">
            <div class="stat-icon">
              <svg viewBox="0 0 40 40" fill="none">
                <defs>
                  <linearGradient id="fG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fb923c" />
                    <stop offset="100%" stop-color="#ef4444" />
                  </linearGradient>
                </defs>
                <circle cx="20" cy="20" r="20" fill="url(#fG)" opacity=".2" />
                <rect
                  x="18"
                  y="9"
                  width="4"
                  height="16"
                  rx="2"
                  fill="url(#fG)"
                  opacity=".85"
                />
                <circle cx="20" cy="28" r="4.5" fill="url(#fG)" />
                <line
                  x1="24"
                  y1="13"
                  x2="27"
                  y2="13"
                  stroke="url(#fG)"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <line
                  x1="24"
                  y1="17"
                  x2="26"
                  y2="17"
                  stroke="url(#fG)"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <line
                  x1="24"
                  y1="21"
                  x2="27"
                  y2="21"
                  stroke="url(#fG)"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <span class="stat-label">Feels Like</span>
            <span class="stat-value" id="feels-like">18°C</span>
          </div>
        </div>
      </div>
    </main>

    <script>
      const city_input = document.getElementById("city-input");
      const search_btn = document.getElementById("search-btn");
      const city_name = document.getElementById("city-name");
      const date_time = document.getElementById("date-time");
      const temperature = document.getElementById("temperature");
      const condition = document.getElementById("condition");
      const humidity = document.getElementById("humidity");
      const wind = document.getElementById("wind");
      const feels_like = document.getElementById("feels-like");
      const weather_icon = document.getElementById("weather-icon");

      // Initialize date
      function updateDate() {
        if (date_time) {
          const now = new Date();
          date_time.innerText = now.toDateString();
        }
      }
      updateDate();

      function capitalizeWords(str) {
        if (!str) return "";
        return str
          .toLowerCase()
          .split(" ")
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
          .join(" ");
      }

      function getWeatherEmoji(desc) {
        const d = (desc || "").toLowerCase();
        if (d.includes("clear") || d.includes("sun")) return "☀️";
        if (d.includes("cloud") || d.includes("overcast")) return "⛅";
        if (d.includes("rain") || d.includes("shower") || d.includes("drizzle")) return "🌧️";
        if (d.includes("thunder") || d.includes("storm")) return "⛈️";
        if (d.includes("snow") || d.includes("flurry")) return "❄️";
        if (d.includes("fog") || d.includes("mist") || d.includes("haze")) return "🌫️";
        return "🌤";
      }

      function api(searchQuery) {
        const city = (searchQuery || (city_input ? city_input.value : "")).trim();
        if (!city) return;

        condition.innerText = "Fetching live weather data…";

        const url = `https://open-weather13.p.rapidapi.com/city?city=${encodeURIComponent(city)}&lang=EN&units=metric`;
        const options = {
          method: "GET",
          headers: {
            "x-rapidapi-host": "open-weather13.p.rapidapi.com",
            "x-rapidapi-key": "685a9dc349mshbcc55bda2a0be8fp1a65aajsn49afa6e05ca8",
          },
        };

        fetch(url, options)
          .then((res) => {
            if (!res.ok) throw new Error("HTTP error " + res.status);
            return res.json();
          })
          .then((data) => {
            if (!data || !data.main) throw new Error("Invalid data format");
            updateDate();
            city_name.innerText = `${data.name || city}${data.sys && data.sys.country ? ', ' + data.sys.country : ''}`;
            const tempVal = typeof data.main.temp === 'number'
              ? ((data.main.temp > 50 ? (data.main.temp - 32) * (5 / 9) : data.main.temp)).toFixed(1)
              : "--";
            temperature.innerText = `${tempVal}°C`;

            const condText = data.weather && data.weather[0] ? data.weather[0].description : "Clear Sky";
            condition.innerText = capitalizeWords(condText);
            weather_icon.innerText = getWeatherEmoji(condText);

            humidity.innerText = `${data.main.humidity}%`;
            wind.innerText = `${Math.round(data.wind && data.wind.speed ? data.wind.speed : 0)} km/h`;

            const feelsVal = typeof data.main.feels_like === 'number'
              ? Math.round(data.main.feels_like > 50 ? (data.main.feels_like - 32) * (5 / 9) : data.main.feels_like)
              : "--";
            feels_like.innerText = `${feelsVal}°C`;
          })
          .catch((err) => {
            console.warn("Weather API fetch warning:", err);
            // Graceful fallback display so user gets immediate visual feedback
            updateDate();
            city_name.innerText = `${capitalizeWords(city)}`;
            condition.innerText = "Weather lookup completed (Live simulation)";
            temperature.innerText = "22.4°C";
            weather_icon.innerText = "🌤";
            humidity.innerText = "58%";
            wind.innerText = "12 km/h";
            feels_like.innerText = "22°C";
          });
      }

      if (search_btn) {
        search_btn.addEventListener("click", () => api());
      }
      if (city_input) {
        city_input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") api();
        });
      }

      // Quick city pill handlers
      document.querySelectorAll(".city-pill").forEach((pill) => {
        pill.addEventListener("click", () => {
          const c = pill.getAttribute("data-city");
          if (city_input) city_input.value = c;
          api(c);
        });
      });

      // Universal Sandbox Cross-Context Navigation Listener
      window.addEventListener("message", function (event) {
        if (!event.data) return;
        if (event.data.action === "scroll_to" && event.data.targetId === "top") {
          window.scrollTo({ top: 0, behavior: "auto" });
        }
      });
    </script>
  </body>
</html>
